name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install .NET Android Workload
      run: dotnet workload install android --skip-manifest-update

    - name: Restore dependencies
      run: dotnet restore Prowl.AndroidRunner/Prowl.AndroidRunner.csproj

    - name: Build & Package APK
      run: >
        dotnet publish Prowl.AndroidRunner/Prowl.AndroidRunner.csproj
        -c Release
        -f net10.0-android
        -p:AndroidPackageFormats=apk
        -p:PublishTrimmed=false
        -p:RunAOTCompilation=false
        -p:AndroidLinkMode=None
        -p:AndroidEnableProfiledAot=false
        -p:AndroidKeyStore=false

    # Awtomatikong tanggalin ang unsigned at intermediate APKs bago mag-upload
    - name: Filter Out Unsigned APKs
      run: |
        echo "Filtering APK files..."
        find Prowl.AndroidRunner/bin/Release/net10.0-android -type f -name "*.apk" ! -name "*-Signed.apk" -delete || true

    - name: Upload Signed APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Prowl-Android-APK
        path: Prowl.AndroidRunner/bin/Release/net10.0-android/**/*-Signed.apk
        if-no-files-found: error
