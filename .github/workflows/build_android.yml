name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install .NET Android Workload
      run: dotnet workload install android --skip-manifest-update

    - name: Restore dependencies
      run: dotnet restore Prowl.AndroidRunner/Prowl.AndroidRunner.csproj

    - name: Build & Package APK
      run: >
        dotnet publish Prowl.AndroidRunner/Prowl.AndroidRunner.csproj
        -c Release
        -f net10.0-android
        -p:AndroidPackageFormats=apk
        -p:PublishTrimmed=false
        -p:RunAOTCompilation=false
        -p:AndroidLinkMode=None
        -p:AndroidEnableProfiledAot=false
        -p:AndroidKeyStore=false

    # Kopyahin lamang ang Signed APK sa malinis na folder (walang kasamang publish/ o bin/ folders)
    - name: Prepare Single APK Output
      run: |
        mkdir -p dist
        find Prowl.AndroidRunner/bin/Release/net10.0-android -type f -name "*-Signed.apk" -exec cp {} dist/ \;
        echo "Listing output APKs in dist:"
        ls -la dist/

    # I-upload ang APK na diretso sa root ng zip
    - name: Upload Signed APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Prowl-Android-APK
        path: dist/*
        if-no-files-found: error
